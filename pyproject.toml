[project]
name = "ambient-loop"
version = "0.1.0"
description = "Heat recovery and ambient loop scenario toolkit (Milieu)"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
  "pdfplumber>=0.11",
  "typer>=0.12",
]

[project.scripts]
ambient-loop = "ambient_loop.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
    "types-PyYAML",
    "types-openpyxl>=3.1.5.20261017",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambient_loop"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]
